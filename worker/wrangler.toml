name = "test-telegram-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Переменные, которые НЕ являются секретами.
# Укажите здесь домен вашего GitHub Pages (через запятую можно несколько).
[vars]
ALLOWED_ORIGINS = "https://DevDopamine.github.io"

# BOT_TOKEN, CHAT_ID и CLIENT_KEY задаются как секреты:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID
#   npx wrangler secret put CLIENT_KEY      # необязательно
